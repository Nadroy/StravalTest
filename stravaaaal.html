<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Stravaaaal</title>
  <style>
    :root{--bg1:#3b0010;--bg2:#120006;--accent:#ffbed2}
    html,body{height:100%;margin:0}
    body{display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,var(--bg1),var(--bg2));color:#ffdfe9;font-family:Inter,system-ui,Arial;overflow:hidden}
    .wrap{position:relative;z-index:2;text-align:center;padding:2rem;max-width:900px}
    h1{font-size:3.2rem;margin:0 0 0.4rem;color:var(--accent);letter-spacing:0.06em}
    p.lead{margin:0 0 1.2rem;color:rgba(255,211,227,0.9)}
    a.back{display:inline-block;margin-top:0.6rem;color:#ffd3e6;text-decoration:underline}
    canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
    .hint{position:fixed;left:12px;bottom:12px;color:rgba(255,255,255,0.6);font-size:13px}
    /* subtle blur layer for depth */
    .vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 20% 20%, rgba(255,160,185,0.06), transparent 20%), radial-gradient(ellipse at 80% 80%, rgba(0,0,0,0.25), transparent 40%);mix-blend-mode:overlay}
  </style>
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <canvas id="bg"></canvas>
  <div class="vignette"></div>
  <div class="wrap">
    <h1>Stravaaaal</h1>
    <p class="lead">reviens plus tard coquin(e) — joue avec la page : bouge ta souris ou touche l'écran pour voir les particules réagir.</p>
    <a class="back" href="index.html">Retour discrètement</a>
  </div>
  <div class="hint">Astuce : secoue le téléphone pour amplifier l'effet</div>

  <script src="js/responsive.js"></script>
  <script>
    (function(){
      const canvas = document.getElementById('bg');
      const ctx = canvas.getContext('2d', {alpha:true});
      let W = canvas.width = innerWidth;
      let H = canvas.height = innerHeight;

      const pointer = {x: W/2, y: H/2, vx: 0, vy:0};
      const particles = [];
      const N = Math.round(Math.max(28, Math.min(120, (W*H)/8000)));
      const colors = ['#ffbed2','#ffd3e6','#ffc1dc','#ff8fb7'];

      function rand(min,max){ return Math.random()*(max-min)+min }
      function init(){ particles.length=0; for(let i=0;i<N;i++){ particles.push({x:rand(0,W), y:rand(0,H), vx:0, vy:0, r:rand(8,28), c:colors[i%colors.length], phase:Math.random()*Math.PI*2}); } }

      function resize(){ W = canvas.width = innerWidth; H = canvas.height = innerHeight; init(); }
      addEventListener('resize', resize);

      // pointer handling
      addEventListener('pointermove', e=>{ pointer.x = e.clientX; pointer.y = e.clientY; });
      addEventListener('touchmove', e=>{ const t = e.touches[0]; if (t) { pointer.x = t.clientX; pointer.y = t.clientY; } }, {passive:true});

      // device motion to add global offset
      let motionX=0, motionY=0;
      if (window.DeviceOrientationEvent){ window.addEventListener('deviceorientation', ev=>{ if (ev.gamma !== null){ motionX = ev.gamma/45; motionY = ev.beta/45; } }); }

      // shake to intensify
      let shake = 0; let lastShake = 0; window.addEventListener('devicemotion', e=>{ const a = e.accelerationIncludingGravity; if (a){ const mag = Math.abs(a.x||0)+Math.abs(a.y||0)+Math.abs(a.z||0); if (mag > 25){ shake = 1.6; lastShake = performance.now(); } } }, {passive:true});

      function render(t){ ctx.clearRect(0,0,W,H);
        // softly move pointer velocity
        pointer.vx += ( (pointer.x - pointer.vx) * 0.08 );
        pointer.vy += ( (pointer.y - pointer.vy) * 0.08 );

        // draw background subtle radial
        const g = ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'rgba(255,160,185,0.04)'); g.addColorStop(1,'rgba(0,0,0,0.18)'); ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

        for (let p of particles){
          // attraction to pointer with distance falloff
          const dx = (pointer.vx + motionX*80) - p.x;
          const dy = (pointer.vy + motionY*80) - p.y;
          const dist = Math.sqrt(dx*dx+dy*dy) + 0.001;
          const force = Math.min(140000/(dist*dist), 2.2) * (shake || 1);
          p.vx += (dx/dist) * 0.03 * force;
          p.vy += (dy/dist) * 0.03 * force;

          // friction
          p.vx *= 0.92; p.vy *= 0.92;
          // small floating motion
          p.x += p.vx + Math.sin(t/600 + p.phase)*0.2;
          p.y += p.vy + Math.cos(t/500 + p.phase)*0.2;

          // wrap around
          if (p.x < -60) p.x = W+60; if (p.x > W+60) p.x = -60;
          if (p.y < -60) p.y = H+60; if (p.y > H+60) p.y = -60;

          // draw bloom circle
          const rad = p.r * (1 + 0.06*Math.sin(t/300 + p.phase));
          const grad = ctx.createRadialGradient(p.x, p.y, rad*0.1, p.x, p.y, rad);
          grad.addColorStop(0, p.c + ''); grad.addColorStop(0.45, p.c + '55'); grad.addColorStop(1, 'rgba(255,255,255,0)');
          ctx.beginPath(); ctx.fillStyle = grad; ctx.arc(p.x,p.y,rad,0,Math.PI*2); ctx.fill();
        }

        // subtle particles lines
        ctx.globalCompositeOperation = 'lighter';
        for (let i=0;i<6;i++){
          const a = (i/6)*Math.PI*2 + (t/2000);
          ctx.strokeStyle = 'rgba(255,200,220,0.02)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(W/2 + Math.cos(a)*120, H/2 + Math.sin(a)*80); ctx.lineTo(pointer.vx, pointer.vy); ctx.stroke();
        }
        ctx.globalCompositeOperation = 'source-over';

        // decay shake
        if (shake > 0 && performance.now() - lastShake > 900) shake *= 0.95; if (shake < 0.02) shake = 0;

        requestAnimationFrame(render);
      }

      init(); requestAnimationFrame(render);

      // ensure pointer defaults to center on load
      pointer.x = W/2; pointer.y = H/2; pointer.vx = W/2; pointer.vy = H/2;

    })();
  </script>
</body>
</html>
